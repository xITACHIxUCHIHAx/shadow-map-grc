services:
  grc:
    image: xitachixuchihax/shadow-map-grc:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grc
    user: "0:0"
    init: true
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      SHADOW_MAP_SECRET_KEY: "${SHADOW_MAP_SECRET_KEY:?Set SHADOW_MAP_SECRET_KEY in .env}"
      SHADOW_MAP_HOST: "0.0.0.0"
      SHADOW_MAP_PORT: "5000"
      SHADOW_MAP_HOST_AGENT_URL: "${SHADOW_MAP_HOST_AGENT_URL:-http://host.docker.internal:5001}"
      SHADOW_MAP_HOST_AGENT_TOKEN: "${SHADOW_MAP_HOST_AGENT_TOKEN:?Host agent token is generated by the launcher}"
      XDG_DATA_HOME: "/app/data"

    volumes:
      - ./data:/app/data

    cap_add:
      - NET_RAW
      - NET_ADMIN

    stop_grace_period: 45s
